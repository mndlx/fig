    <title>FIG</title>
    <script>
      ;(function () {
        var root = document.documentElement
        // Prima del primo disegno: il tema scelto a mano (src/theme.ts), così lo sfondo d'avvio è già quello giusto.
        try {
          var theme = localStorage.getItem('fig-theme')
          if (theme === 'light' || theme === 'dark') {
            root.dataset.theme = theme
            // Anche la barra di stato: i <meta> qui sopra seguono il sistema, il tema scelto a mano vince.
            var metas = document.querySelectorAll('meta[name="theme-color"]')
            for (var i = 0; i < metas.length; i++) metas[i].content = theme === 'dark' ? '#141118' : '#f3eee6'
          }
        } catch (e) {}
        // Su iPhone e iPad l'immagine di avvio copre anche la barra di stato, la pagina no: il fichetto parte mezzo gradino
        // più su, nello stesso punto dell'immagine. (Lì screen.width e screen.height non girano col dispositivo.)
        if (navigator.standalone) {
          var tall = Math.max(screen.width, screen.height)
          var bar = (innerHeight > innerWidth ? tall : screen.width + screen.height - tall) - innerHeight
          if (bar > 0 && bar < 80) root.style.setProperty('--boot-shift', -bar / 2 + 'px')
        }
        // Finché l'app non è partita (il segnale lo dà src/main.tsx) il fichetto non resta a rimbalzare senza dire niente:
        // se un file dell'app non si carica lo si dice subito, se ci mette molto dopo un po'.
        // La lingua: quella scelta nelle impostazioni, altrimenti quella del dispositivo (stessa regola di src/i18n.ts).
        var italian = false
        var stored = null
        try {
          stored = localStorage.getItem('fig-lang')
        } catch (e) {}
        var list = stored === 'it' || stored === 'en' ? [stored] : navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']
        for (var j = 0; j < list.length; j++) if (/^it/i.test(list[j])) italian = true
        function say(it, en) {
          var note = document.getElementById('boot-note')
          if (note && !root.dataset.app) note.textContent = italian ? it : en
        }
        addEventListener(
          'error',
          function (event) {
            var el = event.target
            if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
              say('FIG non riesce a partire. Controlla la connessione e riapri l’app.', 'FIG can’t start. Check your connection and reopen the app.')
            }
          },
          true,
        )
        setTimeout(function () {
          var note = document.getElementById('boot-note')
          if (note && !note.textContent) say('Ci sta mettendo più del solito…', 'This is taking longer than usual…')
        }, 12000)
      })()
    </script>
    <style>
      /* Schermata d'avvio: sta qui e non nel CSS dell'app perché deve esserci al primo disegno, prima di tutto il resto.
         Continua lo splash del sistema (stesso fondo, stesso fichetto, stesso punto) e lo fa rimbalzare finché l'app è pronta. */
      html {
        --boot-bg: #f3eee6;
        --boot-ink: #6b625a;
        background: var(--boot-bg);
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) {
          --boot-bg: #141118;
          --boot-ink: #9a909f;
        }
      }
      html[data-theme='dark'] {
        --boot-bg: #141118;
        --boot-ink: #9a909f;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: var(--boot-bg);
        transition: opacity 0.22s ease;
      }
      #boot.out {
        opacity: 0;
        pointer-events: none;
      }
      .boot-stage {
        position: relative;
        /* Grande quanto il fichetto delle immagini di avvio (BOOT_FIG in scripts/icons.mjs) e circa quanto quello dello splash di Android. */
        width: 208px;
        height: 208px;
        transform: translateY(var(--boot-shift, 0px));
      }
      .boot-fig {
        display: block;
        width: 100%;
        height: 100%;
        /* Il punto d'appoggio del frutto: è da lì che si schiaccia e si allunga. */
        transform-origin: 50% 86%;
        animation: fig-bounce 0.9s 0.1s infinite;
      }
      .boot-fig .fig-eyes {
        transform-box: fill-box;
        transform-origin: center;
        animation: fig-blink 3.6s 1.4s infinite;
      }
      .boot-shadow {
        position: absolute;
        left: 30%;
        right: 30%;
        top: 84%;
        height: 11px;
        border-radius: 50%;
        background: #1e1a17;
        opacity: 0;
        animation: fig-shadow 0.9s 0.1s infinite;
      }
      #boot-note {
        position: absolute;
        left: 24px;
        right: 24px;
        top: calc(50% + 124px);
        margin: 0;
        text-align: center;
        font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--boot-ink);
      }
      @keyframes fig-bounce {
        0%,
        100% {
          transform: translateY(0) scale(1, 1);
          animation-timing-function: ease-out;
        }
        12% {
          transform: translateY(0) scale(1.07, 0.92);
          animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1);
        }
        45% {
          transform: translateY(-30%) scale(0.97, 1.04);
          animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4);
        }
        78% {
          transform: translateY(0) scale(1.09, 0.9);
          animation-timing-function: ease-out;
        }
        90% {
          transform: translateY(-2.5%) scale(0.99, 1.02);
          animation-timing-function: ease-in;
        }
      }
      @keyframes fig-shadow {
        0%,
        12%,
        78%,
        100% {
          opacity: 0;
          transform: scaleX(1);
        }
        45% {
          opacity: 0.1;
          transform: scaleX(0.7);
        }
      }
      @keyframes fig-blink {
        0%,
        93%,
        100% {
          transform: scaleY(1);
        }
        96% {
          transform: scaleY(0.12);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-fig,
        .boot-fig .fig-eyes,
        .boot-shadow {
          animation: none;
        }
      }
    </style>
